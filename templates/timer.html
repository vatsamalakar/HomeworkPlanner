{% extends 'base.html' %}
{% block title %}Homework Racer | Pomodoro{% endblock %}
{% block page_title %}Pomodoro Timer{% endblock %}

{% block content %}
<div class="timer-card">
    <div class="timer-display" id="timerDisplay">25:00</div>
    <div class="timer-controls">
        <button id="startTimer" class="primary-btn">Start</button>
        <button id="pauseTimer" class="secondary-btn">Pause</button>
        <button id="resetTimer" class="ghost-btn">Reset</button>
    </div>
    <p class="muted">Use a focused 25-minute session, then take a short break before restarting.</p>
</div>
<script>
    let timerSeconds = 25 * 60;
    let timerInterval = null;

    function formatTime(seconds) {
        const minutes = String(Math.floor(seconds / 60)).padStart(2, '0');
        const remainder = String(seconds % 60).padStart(2, '0');
        return `${minutes}:${remainder}`;
    }

    function updateTimer() {
        document.getElementById('timerDisplay').innerText = formatTime(timerSeconds);
    }

    function startTimer() {
        if (timerInterval) return;
        timerInterval = setInterval(() => {
            if (timerSeconds <= 0) {
                clearInterval(timerInterval);
                timerInterval = null;
                return;
            }
            timerSeconds -= 1;
            updateTimer();
        }, 1000);
    }

    function pauseTimer() {
        clearInterval(timerInterval);
        timerInterval = null;
    }

    function resetTimer() {
        pauseTimer();
        timerSeconds = 25 * 60;
        updateTimer();
    }

    document.addEventListener('DOMContentLoaded', () => {
        updateTimer();
        document.getElementById('startTimer').addEventListener('click', startTimer);
        document.getElementById('pauseTimer').addEventListener('click', pauseTimer);
        document.getElementById('resetTimer').addEventListener('click', resetTimer);
    });
</script>
{% endblock %}
